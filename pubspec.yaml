name: gebeya
description: "Ethiopian Market Price Tracker - Fair, up-to-date prices of everyday goods in local markets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Backend & Network
  supabase_flutter: ^2.8.4

  # Data Visualization
  fl_chart: ^0.70.2

  # Utilities & Localization
  intl: ^0.20.2
  google_fonts: ^6.2.1
  uuid: ^4.5.1
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
